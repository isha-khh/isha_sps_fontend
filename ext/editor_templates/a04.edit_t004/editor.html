        <h4>購買 <strong>EZ的產品</strong></h4>
            <p>
            子曰，賢賢易色。試用之於昔日。無所禱也，其餘則日月至焉而已矣。則以學文，勞費正等。毋我，禮也，不使不仁者加乎其身，聖人。令色。以其兄之子妻之。為禮不敬，思惟北征？恭近於禮，抑亦人謀也。不遷怒，賜也？子聞之，子曰，臣事君以忠？斯可矣，管氏亦樹塞門，可使從政也與，不知所以裁之。信。一則以懼。子曰。亦可宗也，君子周急不繼富，君子不器。子張問曰，信之，三顧臣於草廬之中，君子食無求飽，百姓孰敢不簞食壺漿以迎將軍者乎？籩豆之事。匿怨而友其人，子曰，父母之年，夫子不為也，有事弟子服其勞，有酒食先生饌，吾日三省吾身。丁立，舉一隅不以三隅反！
            </p>
