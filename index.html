    <script>
        $(document).ready(function () {

            //loading
            setTimeout(function () {
                $('.loading').addClass('is-loaded');

                setTimeout(function () {
                    $('.loading').remove();
                }, 500);
            }, 2000);
        });

        $(function () {
            if (window.innerWidth > 767) {
                $(window).on('scroll', function () {
                    const offsetTop = $(this).scrollTop();

                    // 1. .round_1 視差滾動
                    const $news = $('.home_news');
                    if ($news.length && offsetTop < $news.offset().top) {
                        TweenLite.to(".round_1", 1, {
                            y: -offsetTop / 15
                        });
                    }

                    // 2. .round_3 視差滾動
                    const $industry = $('.home_industry');
                    if ($industry.length && offsetTop < $industry.offset().top) {
                        TweenLite.to(".round_3", 1, {
                            y: -offsetTop / 15
                        });
                    }

                    // 3. .round_5 視差滾動
                    const $enterprise = $('.home_enterprise');
                    if ($enterprise.length && offsetTop < $enterprise.offset().top) {
                        TweenLite.to(".round_5", 1, {
                            y: -offsetTop / 15
                        });
                    }

                }).trigger('scroll');
            }
        });
        //Fancybox彈跳
        document.addEventListener("DOMContentLoaded", function () {
            Fancybox.show([

                    type: "inline"
