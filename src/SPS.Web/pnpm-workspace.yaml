allowBuilds:
  unrs-resolver: true
# 2026-10-22 安全性更新：間接相依（axios→follow-redirects、next→postcss→source-map-js、next→sharp）的已知弱點，
# 強制使用修補版以上；上游（axios／next）更新後若已帶入修補版，可移除對應項目。
# 2026-11-10：follow-redirects 提到 1.16.2（1.16.1 以下有跨 realm sensitiveHeaders 問題）；另外 eslint 工具鏈（只在開發與 CI 的 lint 用，
# 不會進到正式映像）的 brace-expansion、zod、minimatch 也強制用修補版。brace-expansion 與 minimatch 依大版本分段指定，避免把 eslint 用的舊版 API 升壞。
overrides:
  follow-redirects: ">=1.16.2"
  source-map-js: ">=1.2.2"
  sharp: ">=0.35.5"
  zod: ">=4.6.6"
  "brace-expansion@<2": ">=1.1.21 <2"
  "brace-expansion@>=4 <5.0.12": ">=5.0.12"
  "minimatch@>=7.0.0 <11.0.1": ">=11.0.1"
