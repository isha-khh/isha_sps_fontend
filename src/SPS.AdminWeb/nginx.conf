server {
    listen 80;

    # index.html（含 SPA 路由退回的那份）每次都要向伺服器確認：它引用的 JS／CSS 檔名帶雜湊，
    # 沒有這個標頭時瀏覽器會用 Last-Modified 推測快取好幾天，部署新版後使用者還在跑舊版畫面
    # （2026-10-05：後台橫幅表單送出的是舊版欄位，就是這個原因）
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html; # 支援 SPA 路由
        add_header Cache-Control "no-cache";
    }

    # Vite 產生的檔案檔名帶內容雜湊，內容變了檔名就變，可以放心長期快取
    location /assets/ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 後端位址由環境變數 API_UPSTREAM 決定（nginx 映像啟動時會把這個檔案的 ${API_UPSTREAM} 換成實際值，其他 $變數不受影響）。
    # 沒設定時用 Dockerfile 的預設值 http://172.17.0.4:8080（既有測試機的部署方式）；
    # 新的部署請設成後端 container 的名稱，例如 API_UPSTREAM=http://sps-api:8080，不要依賴 docker 橋接網路的 IP
    location /api/ {
        proxy_pass ${API_UPSTREAM}; # 保留 /api 前綴
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SignalR Hubs
    location /hubs/ {
        proxy_pass ${API_UPSTREAM}; # 保留 /hubs 前綴
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
