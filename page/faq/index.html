    <script>
        // 收合
        $(document).on("click", ".btn-collapse", function (e) {
            e.preventDefault();
            e.stopPropagation();

            var $header = $(this);
            var targetId = $header.attr("aria-controls");
            var $body = $("#" + targetId);

            if ($body.length === 0) return;

            if ($body.is(":visible")) {
                $body.stop().slideUp(200, function () {
                    $header.attr("aria-expanded", "false");
                });
            } else {
                $body.stop().slideDown(200, function () {
                    $header.attr("aria-expanded", "true");
                });
            }
        });




        $(function () {
            if (window.innerWidth > 767) {
                $(window).on('scroll', function () {
                    const offsetTop = $(this).scrollTop();

                    // 1. .s_round_1 視差滾動
                    const $industry = $('.footer');
                    if ($industry.length && offsetTop < $industry.offset().top) {
                        TweenLite.to(".s_round_6, .s_round_3", 1, {
                            y: -offsetTop / 15
                        });
                    }


                }).trigger('scroll');
            }
        });
