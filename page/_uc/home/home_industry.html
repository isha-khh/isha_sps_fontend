<script type="text/javascript">
    $(document).ready(function () {
        $('.home_industry_box .ser_box').each(function () {
            const $box = $(this);
            const $slider = $box.find('.wid-ind');
            const $prev = $box.find('.custom-prev');
            const $next = $box.find('.custom-next');
            const $pauseBtn = $box.find('.slick-play-pause-btn');

            // 1.item 寫入 01, 02, 03...
            $slider.children('.item').each(function (index) {
                const formattedNumber = String(index + 1).padStart(2, '0');
                $(this).find('.i_number').text(formattedNumber);
            });

         
            $slider.slick({
                autoplaySpeed: 3000,
                infinite: true,
                 autoplay: true, 
                slidesToShow: 1,
                slidesToScroll: 1,
                arrows: true,
                prevArrow: $prev,
                nextArrow: $next,
                pauseOnHover: true,
                pauseOnFocus: true
            });

            //  暫停 / 播放切換
            let isPaused = false;
            $pauseBtn.on('click', function () {
                if (!isPaused) {
                    $slider.slick('slickPause');
                    isPaused = true;
                    $(this).attr('aria-label', '播放輪播')
                        .attr('aria-pressed', 'true')
                        .find('i').removeClass('bi-pause-fill').addClass('bi-play-fill');
                    $(this).find('.visually-hidden').text('播放輪播');
                } else {
                    $slider.slick('slickPlay');
                    isPaused = false;
                    $(this).attr('aria-label', '暫停輪播')
                        .attr('aria-pressed', 'false')
                        .find('i').removeClass('bi-play-fill').addClass('bi-pause-fill');
                    $(this).find('.visually-hidden').text('暫停輪播');
                }
            });
        });
    });
</script>
