<script>
    $(document).ready(function () {

        // ==========================================
        // 1. 頂部搜尋列浮動面板控制
        // ==========================================
        function closeAllPanels() {
            $(".ma_sear_panel").slideUp(150);
            $(".btn-filter-toggle")
                .removeClass("active")
                .attr("aria-expanded", "false");
        }

        // 點擊頂部按鈕：開啟/關閉對應浮動面板
        $(document).on("click", ".btn-filter-toggle", function (e) {
            e.preventDefault();
            e.stopPropagation();

            var $btn = $(this);
            var targetId = $btn.attr("aria-controls");
            var $targetPanel = $("#" + targetId);
            var isExpanded = $btn.attr("aria-expanded") === "true";

            if (isExpanded) {
                $targetPanel.slideUp(150);
                $btn.removeClass("active").attr("aria-expanded", "false");
            } else {
                closeAllPanels();
                $btn.addClass("active").attr("aria-expanded", "true");
                $targetPanel.slideDown(150);
            }
        });

        // 阻止浮動面板內部的所有點擊事件冒泡到 document（避免點內部選項時面板被關閉）
        $(document).on("click", ".ma_sear_panel", function (e) {
            e.stopPropagation();
        });

        // 點擊頁面空白處關閉浮動面板
        $(document).on("click", function () {
            closeAllPanels();
        });

        // 按 ESC 鍵關閉面板
        $(document).on("keydown", function (e) {
            if (e.key === "Escape" || e.key === "Esc") {
                var $activeBtn = $(".btn-filter-toggle.active");
                if ($activeBtn.length) {
                    closeAllPanels();
                    $activeBtn.focus();
                }
            }
        });


        // ==========================================
        // 2. 智慧技術：左側頁籤切換 (改用委派綁定，避免在浮動層內失效)
        // ==========================================
        $(document).on("click", ".sm_techn_left .tab-btn", function (e) {
            e.preventDefault();
            e.stopPropagation();

            var $btn = $(this);
            var targetPanelId = $btn.attr("aria-controls");
            var $container = $btn.closest(".sm_techn"); // 鎖定當前組件範圍

            // 切換左側按鈕高亮
            $container.find(".sm_techn_left .tab-btn")
                .removeClass("active")
                .attr("aria-selected", "false");

            $btn.addClass("active")
                .attr("aria-selected", "true");

            // 切換右側面板顯示
            $container.find(".sm_techn_right .tab-panel").addClass("d-none");
            $container.find("#" + targetPanelId).removeClass("d-none");

            // 手機版自動平滑滾動置中
            if (window.innerWidth < 768) {
                var $tabList = $container.find(".sm_techn_left");
                var scrollLeft = $btn.position().left + $tabList.scrollLeft() - ($tabList.width() / 2) + ($btn.outerWidth() / 2);
                $tabList.stop().animate({ scrollLeft: scrollLeft }, 250);
            }
        });


        // ==========================================
        // 3. 右側次標題收合 / 展開 (強化狀態比對)
        // ==========================================
        $(document).on("click", ".btn-collapse", function (e) {
            e.preventDefault();
            e.stopPropagation();

            var $header = $(this);
            var targetId = $header.attr("aria-controls");
            var $body = $("#" + targetId);

            // 以元素當前實際是否可見為準，避免 aria-expanded 與 style 不同步
            if ($body.is(":visible")) {
                $body.stop().slideUp(200, function () {
                    $header.attr("aria-expanded", "false");
                });
            } else {
                $body.stop().slideDown(200, function () {
                    $header.attr("aria-expanded", "true");
                });
            }
        });

    });
</script>
