    <button type="button" class="bsnavclose close-btn border-0 bg-transparent" aria-label="關閉選單" tabindex="-1">
        <img src="images/all/close.svg" alt="" aria-hidden="true" />
    </button>
    <div class="bsnav-mobile-overlay"></div>
    <div class="navbar nav-big-wrapper">
        <div class="navbar-mobile-wrapper"></div>
    </div>
</div>

<!--
  //預設右方開啟
  如果要左方開啟則在 bsnav-mobile 加 left
  → <div class="bsnav-mobile left">
  //樣式參考：https://fitodac.github.io/bsnav/
-->


<script>
    //手機選單關閉按鈕
    $(document).ready(function () {

        const focusableSelectors = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

        // 關閉選單並將焦點歸還給漢堡按鈕
        function closeMobileNav() {
            const $mobileNav = $(".bsnav-mobile");
            const $toggler = $(".navbar-toggler");

            if ($mobileNav.hasClass("in")) {
                $mobileNav.removeClass("in");
                $toggler.removeClass("active").attr("aria-expanded", "false");
                $(".bsnavclose").removeClass("active");
                $("body, html").removeClass("bsnav-mobile-open");

                // 歸還焦點
                $toggler.focus();
            }
        }

        // 點擊關閉按鈕或遮罩關閉
        $(document).on("click", ".bsnavclose, .bsnav-mobile-overlay", function (e) {
            e.preventDefault();
            e.stopPropagation();
            closeMobileNav();
        });

        // 鍵盤無障礙控制 (ESC 關閉 + Tab 焦點鎖定在側邊欄內)
        $(document).on("keydown", function (e) {
            const $mobileNav = $(".bsnav-mobile");

            // 僅在手機版選單開啟狀態下處理
            if (!$mobileNav.hasClass("in")) return;

            // 1. 按 ESC 關閉選單
            if (e.key === "Escape" || e.keyCode === 27) {
                e.preventDefault();
                closeMobileNav();
                return;
            }

            // 2. 按 Tab 進行焦點循環 (Focus Trap)
            if (e.key === "Tab" || e.keyCode === 9) {
                // 抓取側欄內所有目前可見且可聚焦的元素
                const $focusableElements = $mobileNav.find(focusableSelectors).filter(':visible');
                if ($focusableElements.length === 0) return;

                const $firstElement = $focusableElements.first();
                const $lastElement = $focusableElements.last();

                if (e.shiftKey) {
                    // Shift + Tab：如果目前在第一個元素，跳到最後一個
                    if ($(document.activeElement).is($firstElement)) {
                        e.preventDefault();
                        $lastElement.focus();
                    }
                } else {
                    // Tab：如果目前在最後一個元素，跳回第一個（關閉按鈕）
                    if ($(document.activeElement).is($lastElement)) {
                        e.preventDefault();
                        $firstElement.focus();
                    }
                }
            }
        });

        // 視窗拉大時重設
        $(window).resize(function () {
            if ($(window).width() >= 768) {
                closeMobileNav();
            }
        });

        //訂閱電子報
        $('.btn-scroll-newsletter').on('click', function (e) {
            e.preventDefault();
            const $target = $('.footer-top');

            if ($target.length) {
                const headerOffset = 0;
                const targetPosition = $target.offset().top - headerOffset;

                $('html, body').animate({
                    scrollTop: targetPosition
                }, 600); 
            }
        });
    });


    // 手機版下拉選單
    $(function () {
        // 僅監聽第一層的 toggle 按鈕，第 2 層不綁定手風琴收合
        $(document).on('click', '.navbar-nav > .nav-item > .dropdown-toggle', function (e) {
            if (window.innerWidth < 992) {
                const $this = $(this);
                const $dropdownMenu = $this.siblings('.dropdown-menu');

                if ($dropdownMenu.length > 0) {
                    e.preventDefault();
                    e.stopPropagation();

                    const $parentLi = $this.parent('li');

                    // 關閉其他主選單項目
                    $parentLi.siblings().find('.dropdown-menu').slideUp(200).removeClass('show');
                    $parentLi.siblings().find('.dropdown-toggle').removeClass('show').attr('aria-expanded', 'false');

                    // 切換當前第 1 層（包含裡面的第 3 層）
                    if ($dropdownMenu.is(':visible')) {
                        $dropdownMenu.slideUp(200).removeClass('show');
                        $this.removeClass('show').attr('aria-expanded', 'false');
                    } else {
                        $dropdownMenu.slideDown(200).addClass('show');
                        $this.addClass('show').attr('aria-expanded', 'true');

                        // 確保點開第一層時，第 3 層也是直接展開狀態
                        $dropdownMenu.find('.dropdown-menu').show().addClass('show');
                    }
                }
            }
        });
    });

    /* 無障礙設定 */

    // 1. 改用事件委派（Event Delegation），確保 .load() 動態載入的 nav 也能正常運作
    $(document).on('focusin mouseenter', '.navbar-expand-md .nav-item.dropdown', function () {
        $(this).find('.dropdown-toggle').attr('aria-expanded', 'true');
    });

    $(document).on('mouseleave', '.navbar-expand-md .nav-item.dropdown', function () {
        $(this).find('.dropdown-toggle').attr('aria-expanded', 'false');
    });

    $(document).on('focusout', '.navbar-expand-md .nav-item.dropdown', function (e) {
        const dropdown = this;
        // 延遲微任務檢查，確認焦點是否真的離開了整組 dropdown
        setTimeout(() => {
            if (!dropdown.contains(document.activeElement)) {
                $(dropdown).find('.dropdown-toggle').attr('aria-expanded', 'false');
            }
        }, 10);
    });

    // 2. 關閉選單並同步無障礙焦點
    function closeMobileNav() {
        const $mobileNav = $(".bsnav-mobile");
        const $toggler = $(".navbar-toggler");

        if ($mobileNav.hasClass("in")) {
            $mobileNav.removeClass("in");
            $toggler.removeClass("active").attr("aria-expanded", "false");
            $(".bsnavclose").removeClass("active");
            $("body, html").removeClass("bsnav-mobile-open");

            // 僅在手機版（按鈕可見時）才把焦點還給漢堡按鈕，避免桌機版被強拉焦點
            if ($toggler.is(":visible")) {
                $toggler.focus();
            }
        }
    }

    // 點擊關閉按鈕或遮罩時關閉
    $(document).on("click", ".bsnavclose, .bsnav-mobile-overlay", function (e) {
        e.preventDefault();
        e.stopPropagation();
        closeMobileNav();
    });

    // 按下鍵盤 ESC 鍵時關閉選單
    $(document).on("keydown", function (e) {
        if (e.key === "Escape" || e.keyCode === 27) {
            closeMobileNav();
        }
    });

    // 視窗尺寸拉大時自動重設
    $(window).on("resize", function () {
        if ($(window).width() >= 768) {
            closeMobileNav();
        }
    });


    /* 無障礙END */
</script>
