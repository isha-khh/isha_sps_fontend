    <script>

        //日期
        const startPicker = flatpickr("#startDate", {
            locale: "zh",
            dateFormat: "Y-m-d",
            disableMobile: true,
            onChange: function (selectedDates, dateStr, instance) {
                endPicker.set("minDate", dateStr);
            }
        });

        const endPicker = flatpickr("#endDate", {
            locale: "zh",
            dateFormat: "Y-m-d",
            disableMobile: true,
            onChange: function (selectedDates, dateStr, instance) {
                startPicker.set("maxDate", dateStr);
            }
        });




        $(document).ready(function () {
            //智慧技術
            // 1. 左側頁籤切換（支援桌機與手機版）
            $(".sm_techn_left").on("click", ".tab-btn", function () {
                var $btn = $(this);
                var targetPanelId = $btn.attr("aria-controls");

                // 更新頁籤選取狀態（無障礙 aria-selected）
                $(".sm_techn_left .tab-btn")
                    .removeClass("active")
                    .attr("aria-selected", "false");

                $btn.addClass("active")
                    .attr("aria-selected", "true");

                // 切換右側對應內容面板
                $(".sm_techn_right .tab-panel").addClass("d-none");
                $("#" + targetPanelId).removeClass("d-none");

                // 手機版 (螢幕寬度小於 768px)：點擊頁籤自動平滑捲動至視窗中央
                if (window.innerWidth < 768) {
                    var $tabList = $(".sm_techn_left");
                    var scrollLeft = $btn.position().left + $tabList.scrollLeft() - ($tabList.width() / 2) + ($btn.outerWidth() / 2);
                    $tabList.stop().animate({ scrollLeft: scrollLeft }, 250);
                }
            });

            // 2. 右側次標題收合 / 展開（無障礙 aria-expanded 動態同步）
            $(document).on("click", ".btn-collapse", function () {
                var $header = $(this);
                var targetId = $header.attr("aria-controls");
                var $body = $("#" + targetId);
                var isExpanded = $header.attr("aria-expanded") === "true";

                if (isExpanded) {
                    $body.stop().slideUp(200, function () {
                        $header.attr("aria-expanded", "false");
                    });
                } else {
                    $body.stop().slideDown(200, function () {
                        $header.attr("aria-expanded", "true");
                    });
                }
            });

            Dropzone.autoDiscover = false;

            $(".uplo_cpo").each(function () {
                var $wrap = $(this);
                var $previewNode = $wrap.find(".dz-image-preview");

                // 擷取並移除模板節點
                var previewTemplate = $previewNode.parent().html();
                $previewNode.remove();

                var myDropzone = new Dropzone($wrap[0], {
                    url: "/upload",
                    maxFiles: 1,
                    maxFilesize: 10, // 配合您的說明可改成 10MB
                    // 加上 .pdf 與 application/pdf
                    acceptedFiles: ".jpg,.jpeg,.png,.pdf,application/pdf",
                    thumbnailWidth: 80,
                    thumbnailHeight: 80,
                    parallelUploads: 1,
                    previewTemplate: previewTemplate,
                    autoQueue: false,
                    previewsContainer: $wrap.find(".files")[0],
                    clickable: $wrap.find(".fileinput-button")[0],

                    init: function () {
                        var dz = this;
                        var $actions = $wrap.find(".actions-wrap");


                        dz.on("addedfile", function (file) {
                            $actions.hide();

                            // 若上傳的是 PDF，Dropzone 無法自動產生縮圖，改用預設圖示替代
                            if (file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")) {

                                dz.emit("thumbnail", file, "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' fill='%230052cc' viewBox='0 0 16 16'><path d='M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2zM9.5 1.5 13 5h-3.5V1.5zM4.5 9.5a.5.5 0 0 1 .5-.5h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1-.5-.5zm0 2a.5.5 0 0 1 .5-.5h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1-.5-.5z'/></svg>");
                            }
                        });

                        // 2. 刪除檔案時重新顯示按鈕
                        dz.on("removedfile", function (file) {
                            $actions.show();
                        });
                    }
                });
            });

            //密碼開關
            $(".icon-eyes").click(function () {
                var $btn = $(this);
                var inputId = $btn.data('id');
                var inputEl = document.getElementById(inputId);

                if (inputEl.type === "password") {
                    // 切換為顯示密碼
                    inputEl.type = "text";
                    $btn.find('.bi').removeClass("bi-eye-slash").addClass("bi-eye");
                    $btn.attr('aria-label', '隱藏密碼');
                    $btn.attr('title', '隱藏密碼');
                    $btn.attr('aria-pressed', 'true');
                } else {
                    // 切換為隱藏密碼
                    inputEl.type = "password";
                    $btn.find('.bi').removeClass("bi-eye").addClass("bi-eye-slash");
                    $btn.attr('aria-label', '顯示密碼');
                    $btn.attr('title', '顯示密碼');
                    $btn.attr('aria-pressed', 'false');
                }
            });
        });




        //標題
        $(function () {
            const $track = $('.marquee-track');
            const $firstSpan = $track.find('span').first();

            if ($firstSpan.length) {
                const windowWidth = $(window).width();
                let totalWidth = $firstSpan.outerWidth(true);

                // 1. 自動複製，直到文字總寬度至少大於螢幕寬度（確保大螢幕不留白）
                while (totalWidth < windowWidth * 1.5) {
                    $track.append($firstSpan.clone());
                    totalWidth = $track.outerWidth(true);
                }

                // 2. 將整組內容完整複製一份加入尾端，搭配 CSS -50% 達成完美無縫滾動
                const currentContent = $track.html();
                $track.append(currentContent);
            }
        });

        $(function () {
            if (window.innerWidth > 767) {
                $(window).on('scroll', function () {
                    const offsetTop = $(this).scrollTop();

                    // 1. .s_round_1 視差滾動
                    const $industry = $('.footer');
                    if ($industry.length && offsetTop < $industry.offset().top) {
                        TweenLite.to(".s_round_6, .s_round_3", 1, {
                            y: -offsetTop / 15
                        });
                    }


                }).trigger('scroll');
            }
        });

    </script>


</body>
</html>
