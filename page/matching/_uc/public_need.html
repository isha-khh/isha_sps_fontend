<script type="text/javascript">
    $(document).ready(function () {
        const $cont = $('.cont');
        const $slider = $cont.find('.wid-pub');
        const $prev = $cont.find('.custom-prev');
        const $next = $cont.find('.custom-next');
        const $pauseBtn = $cont.find('.slick-play-pause-btn');

        // 1. 初始化 Slick 輪播
        $slider.slick({
            infinite: true,
            slidesToShow: 3,
            slidesToScroll: 1,
            autoplay: true,
            autoplaySpeed: 3000,
            arrows: true,
            prevArrow: $prev,
            nextArrow: $next,
            responsive: [
                {
                    breakpoint: 992,
                    settings: {
                        slidesToShow: 2,
                      
                    }
                },
                {
                    breakpoint: 768,
                    settings: {
                        slidesToShow: 1,
                      
                    }
                }
            ]
        });

        // 2. 排除複製節點的 Tab 焦點
        function fixSlickTabFocus() {
            $slider.find('.slick-cloned a, .slick-cloned button').attr('tabindex', '-1').attr('aria-hidden', 'true');
        }

        fixSlickTabFocus();
        $slider.on('afterChange', function () {
            fixSlickTabFocus();
        });

        // 3. Tab 鍵聚焦時自動滾動到當前卡片
        $slider.find('.slick-slide:not(.slick-cloned) a').on('focus', function () {
            const slideIndex = $(this).closest('.slick-slide').data('slick-index');
            $slider.slick('slickGoTo', slideIndex);
        });

        // 4. 暫停 / 播放按鈕切換
        let isPaused = false;
        $pauseBtn.on('click', function () {
            if (!isPaused) {
                $slider.slick('slickPause');
                isPaused = true;
                $(this).attr('aria-label', '播放輪播')
                    .attr('aria-pressed', 'true')
                    .find('i').removeClass('bi-pause-fill').addClass('bi-play-fill');
                $(this).find('.visually-hidden').text('播放輪播');
            } else {
                $slider.slick('slickPlay');
                isPaused = false;
                $(this).attr('aria-label', '暫停輪播')
                    .attr('aria-pressed', 'false')
                    .find('i').removeClass('bi-play-fill').addClass('bi-pause-fill');
                $(this).find('.visually-hidden').text('暫停輪播');
            }
        });
    });
</script>
