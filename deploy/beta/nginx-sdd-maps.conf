# 安裝位置：/etc/nginx/conf.d/sps-sdd-maps.conf（http 層級；由 cutover-nginx.sh 安裝，nginx.conf 要有 include conf.d/*.conf）
# 變數刻意取新名字（sdd_ 開頭）：不跟 AInspec 那邊的 $petroweld_client_ip 共用（對方之後會改它），
# 也不跟 match 網域 nginx-match.conf 用 set 建立的 $sps_block_write 重名（同名會讓 nginx -t 失敗）。

# 真實用戶 IP：取 X-Forwarded-For 最右邊的值＝F5 看到的連線來源，用戶自己塞在前面的假值會被丟掉。
# 後端信任這個標頭、取最右邊的值當用戶 IP（登入鎖定、操作紀錄、訪客計數都靠它）。
map $http_x_forwarded_for $sdd_client_ip {
    "~(?<last>[^, ]+) *$"  $last;
    default                $remote_addr;
}

# 前台網域不需要管理 API 的修改類方法（PUT／PATCH／DELETE），只有會員中心、會員聊天、通行金鑰（Auth）用得到——
# 與 nginx-match.conf 的規則相同（2026-10-20 弱點掃描 VAS01）。放在 http 層級、用 map，不在共用的 server { } 裡放 if／set。
# 正則依出現順序比對，先比對到的為準：允許清單在前。
map "$request_method:$uri" $sdd_block_write {
    default 0;
    "~^(PUT|PATCH|DELETE):(/sps)?/api/(member|member-chat|Auth)(/|$)"  0;
    "~^(PUT|PATCH|DELETE):"                                            1;
}
