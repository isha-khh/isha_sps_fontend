# 主機 nginx：把 beta 轉給容器（直接指向容器 IP，beta 容器不對主機開任何 port）。
# 容器 IP 由 docker-compose.beta.yml 固定：api 172.31.50.10:8080、web 172.31.50.11:3000、admin 172.31.50.12:80
#
# 【match.isafe.org.tw】這個網域已經有 server 區塊（根目錄是舊系統）——**只把下面第一段的 location 加進
# 現有的 server { } 裡，不要整段取代**。
# 【match-admin.isafe.org.tw】是新網域，用第二段整個 server 區塊。
# 憑證路徑與 listen 設定請沿用主機上其他網站的寫法。
#
# 安全標頭：先把同資料夾的 nginx-security-headers.conf 複製到 /etc/nginx/snippets/sps-security-headers.conf，
# 下面每個 location 都 include 它（nginx 的 add_header 不會繼承到有自己 add_header 的 location）。

# ─────────── 加進 match.isafe.org.tw 現有的 server { } ───────────

    client_max_body_size 100m;   # 後端上傳上限 100MB（若這個 server 已設定更大的值就不用加）

    # 瀏覽器端 API：前台把 API 呼叫送到 /sps/api，去掉 /sps 前綴再轉給後端
    location /sps/api/ {
        include snippets/sps-security-headers.conf;
        proxy_pass http://172.31.50.10:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 即時連線（會員聊天，SignalR／WebSocket）
    location /sps/hubs/ {
        include snippets/sps-security-headers.conf;
        proxy_pass http://172.31.50.10:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # 前台頁面與 /_next 靜態資源
    # 注意：這裡是 `/sps`（結尾不要加斜線）。若寫成 `/sps/`，nginx 會自動把 `/sps` 301 轉到 `/sps/`，
    # 而 Next.js（basePath=/sps）又把 `/sps/` 308 轉回 `/sps`，瀏覽器就會出現「重新導向的次數過多」。
    location /sps {
        # 這裡【不要】include 安全標頭 snippet：前台（Next.js）自己會在回應裡加 nosniff／X-Frame-Options／Referrer-Policy（next.config.ts），重複加會出現兩次。
        proxy_pass http://172.31.50.11:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 後端回傳的圖片、下載連結是不帶 /sps 的 /api/…（網域根目錄的 /api 目前沒有被舊系統使用）
    location /api/ {
        include snippets/sps-security-headers.conf;
        proxy_pass http://172.31.50.10:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

# ─────────── match-admin.isafe.org.tw（新的 server 區塊）───────────

server {
    listen 443 ssl;
    http2 on;
    server_name match-admin.isafe.org.tw;

    # ssl_certificate     …;   # 沿用主機上現有的憑證設定
    # ssl_certificate_key …;

    client_max_body_size 100m;

    location /api/ {
        include snippets/sps-security-headers.conf;
        proxy_pass http://172.31.50.10:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        include snippets/sps-security-headers.conf;
        proxy_pass http://172.31.50.10:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        include snippets/sps-security-headers.conf;
        proxy_pass http://172.31.50.12:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 另外：port 80 的 http→https 轉址請沿用主機上其他網站的作法。
