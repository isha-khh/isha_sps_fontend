# 安裝位置：/etc/nginx/snippets/sps-sdd-locations.conf（由 cutover-nginx.sh 安裝）
# 在 sdd.conf 的 server { } 裡以 `include snippets/sps-sdd-locations.conf;` 取代原本指向 127.0.0.1:8080（舊系統）的
# `location = /sps` 與 `location /sps/` 兩段。`^~ /sps/AInspec/`（另一個系統）不動——它的前綴比 /sps/ 長，仍然優先。
#
# 容器 IP 由 docker-compose.beta.yml 固定：api 172.31.50.10:8080、web 172.31.50.11:3000。
# 標頭沿用 sdd.conf 的慣例：Host 寫死 sdd.nat.gov.tw、X-Forwarded-Proto 寫死 https（TLS 在 F5 終止，nginx 看到的可能是 http）。
# 不加根目錄 /api/：sdd.nat.gov.tw 的 /api/ 不屬於本站，圖片等網址由前台程式補上 /sps/ 前綴（beta.33 起）。

# 前台頁面（Next.js，basePath=/sps）
location = /sps {
    proxy_pass http://172.31.50.11:3000;
    proxy_set_header Host sdd.nat.gov.tw;
    proxy_set_header X-Real-IP $sdd_client_ip;
    proxy_set_header X-Forwarded-For $sdd_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host sdd.nat.gov.tw;
    proxy_redirect off;
}

location /sps/ {
    # 前台（Next.js）自己會加 nosniff／X-Frame-Options 等標頭，這裡不要再 include 安全標頭 snippet（會重複）
    proxy_pass http://172.31.50.11:3000;
    proxy_set_header Host sdd.nat.gov.tw;
    proxy_set_header X-Real-IP $sdd_client_ip;
    proxy_set_header X-Forwarded-For $sdd_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host sdd.nat.gov.tw;
    proxy_redirect off;
}

# 瀏覽器端 API：前台把 API 呼叫送到 /sps/api，去掉 /sps 前綴再轉給後端
location /sps/api/ {
    if ($sdd_block_write) { return 405; }
    proxy_hide_header Allow;
    include snippets/sps-security-headers.conf;
    proxy_pass http://172.31.50.10:8080/api/;
    proxy_set_header Host sdd.nat.gov.tw;
    proxy_set_header X-Real-IP $sdd_client_ip;
    proxy_set_header X-Forwarded-For $sdd_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host sdd.nat.gov.tw;
    proxy_redirect off;
}

# 即時連線（會員聊天，SignalR／WebSocket）
location /sps/hubs/ {
    include snippets/sps-security-headers.conf;
    proxy_pass http://172.31.50.10:8080/hubs/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host sdd.nat.gov.tw;
    proxy_set_header X-Real-IP $sdd_client_ip;
    proxy_set_header X-Forwarded-For $sdd_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host sdd.nat.gov.tw;
    proxy_redirect off;
    proxy_read_timeout 3600s;
}
