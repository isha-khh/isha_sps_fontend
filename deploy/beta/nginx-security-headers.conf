# 基本安全標頭（2026-10-15 ZAP 掃描建議；與測試機 nginx 的設定一致）。
# 放在 /etc/nginx/snippets/sps-security-headers.conf，在 beta 的各個 location 裡用
#   include snippets/sps-security-headers.conf;
# 引入（nginx 的 add_header 不會繼承到有自己 add_header 的 location，所以每個 location 都要 include）。
#
# 用在後端 API（/sps/api、/sps/hubs、/api）與後台網域的 location。【前台 /sps 不要 include】：前台（Next.js）自己在
# next.config.ts 加了同樣的標頭，兩邊都加會出現兩次。正式機這台主機的 nginx 是共用的，沒有 include 後台「HTTP 安全設定」產生的檔案，
# 所以用這份靜態的補上。

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;

# 後端 API 自己也會加上面三個標頭（2026-10-20 起，不依賴 nginx）；先把上游的同名標頭隱藏再由 nginx 加，避免回應裡同一個標頭出現兩次
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;

# HSTS：瀏覽器看過一次之後，整個網域（match.isafe.org.tw，包含同網域的舊系統）都會被強制走 HTTPS，一年內無法改回 http。
# 確認舊系統與所有子網域都已經是 HTTPS 再打開，所以預設註解掉；不加 includeSubDomains 比較保守。
# add_header Strict-Transport-Security "max-age=31536000" always;

# 隱藏 nginx 版本號（Server: nginx/1.24.0 (Ubuntu) → Server: nginx）：這是整台 nginx 的設定，要放在 /etc/nginx/nginx.conf 的 http { } 裡，
# 不能放在 server 或 location：
#   server_tokens off;
