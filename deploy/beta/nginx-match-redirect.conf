# 安裝位置：/etc/nginx/snippets/sps-match-redirect.conf（由 cutover-nginx.sh 安裝）
# 在 match.isafe.org.tw 的 server { } 裡以 `include snippets/sps-match-redirect.conf;` 取代原本轉給 beta 容器的
# `location /sps/api/`、`location /sps/hubs/`、`location /sps` 三段：match.isafe.org.tw/sps 一律 301 到 sdd.nat.gov.tw/sps（保留路徑與查詢字串）。
# 注意：瀏覽器會長期快取 301，切換後如果又要回到 match 網域，已被導走的使用者會繼續被導向 sdd.nat.gov.tw。
# match 網域根目錄的 /api/（舊內容的圖片網址）與 match-admin 不受影響。
location = /sps {
    return 301 https://sdd.nat.gov.tw/sps;
}

# ^~：優先於同一個 server 裡的任何正規表示式 location
location ^~ /sps/ {
    return 301 https://sdd.nat.gov.tw$request_uri;
}
