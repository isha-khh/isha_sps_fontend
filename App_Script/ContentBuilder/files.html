<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <title>Images</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content=""> 
    <style>
        body {font-family:Sans-Serif}
        #files {margin:20px;}
        #files a {display:inline-block;border:#D8D8D8 2px solid;margin:3px;padding:5px 15px;box-sizing:border-box;text-decoration:none;}
    </style> 
</head>
<body>

<div id="files">
    <a href="uploads/file1.pdf">file1.pdf</a>
    <a href="uploads/file2.pdf">file2.pdf</a>
    <a href="uploads/file3.pdf">file3.pdf</a>
</div>

<script>
    var links = document.querySelectorAll('#files a');
    [].forEach.call(links, function(link) {
        
        var fileurl = link.getAttribute('href');
        link.addEventListener('click', (e) => {
            
            /* 
            USE THIS FUNCTION TO SELECT CUSTOM ASSET WITH CUSTOM VALUE TO RETURN 
            An asset can be a file, an image or a page in your own CMS
            */
            parent.selectFile(fileurl);
            
            e.preventDefault();
            
        });

    });
</script>
</body>
</html>
