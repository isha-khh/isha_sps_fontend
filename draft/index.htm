
<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>節約能源園區_家計簿開版</title>
<meta name="copyright" content="網頁設計_藝誠網站設計" />
<meta name="viewport" content="width=1200" />
<script type="text/javascript" src="js/jquery-1.7.1.min.js"></script>

<style type="text/css">
body{margin: 0px;}
.bg1000{background-position:100% 0; background-repeat:no-repeat}
.bg0100{background-position:0 100%; background-repeat:no-repeat}
.bg00{background-position:0 0; background-repeat:no-repeat}
.bg100100{background-position:100% 100%; background-repeat:no-repeat}

    
.line-top{
    position: fixed;
    z-index: 99;
    top: 0;
    left: 0;
    width: 100%;
    height: 10px;

}
.line-bottom{
    position: fixed;
    z-index: 99;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 10px;
} 
.line-left{
    position: fixed;
    z-index: 99;
    top: 0;
    left: 0;
    width: 10px;
    height: 100%;
}  
.line-right{
    position: fixed;
    z-index: 99;
    top: 60%;
    right: 10px;
  
} 
    
    
</style>
<script type="text/javascript">
$(function(){
    $("#gotop").click(function(){
        jQuery("html,body").animate({
            scrollTop:0
        },500);
    });
    $(window).scroll(function() {
        if ( $(this).scrollTop() > 100){
            $('#gotop').fadeIn("fast");
        } else {
            $('#gotop').stop().fadeOut("fast");
        }
    });
});
</script>
</head>
<body>
    <div class="line-top">
    </div>
    <div class="line-bottom"></div>
    <div class="line-left"></div>
    <div class="line-right">
    <!-- <img src="images/index/contact.png" border="0">-->

    </div>
    
    <div><a href="#"><img src="images/index/index3.jpg" width="100%"></a></div>
</body>
</html>
